[package]
name = "bluey"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["bluey contributors"]
description = "A beautiful, keyboard-driven Bluetooth manager for the terminal"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dummy3ye/bluey"
keywords = ["bluetooth", "tui", "ratatui", "bluez", "linux"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
anyhow = "1"
bluer = { version = "0.17", features = ["bluetoothd"] }
futures = "0.3"
ratatui = "0.29"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "1.0.7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
